<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moje kolorowanki</title>
<style>
    :root{
        --bg:#f5f3ef;
        --panel:#ffffff;
        --line:#dedbd5;
        --text:#292725;
        --muted:#817b74;
        --accent:#8d6e63;
        --accent-light:#efe7e2;
        --danger:#b85c5c;
        --shadow:0 8px 28px rgba(50,40,30,.08);
    }
    *{box-sizing:border-box}
    body{
        margin:0;
        min-height:100vh;
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
        color:var(--text);
        background:var(--bg);
    }
    button,input{font:inherit}
    button{cursor:pointer}

    .app{
        display:flex;
        min-height:100vh;
    }

    /* LEWY PANEL */
    .sidebar{
        width:310px;
        flex-shrink:0;
        background:#fbfaf8;
        border-right:1px solid var(--line);
        padding:24px 18px;
        display:flex;
        flex-direction:column;
    }
    .brand{
        padding:4px 10px 22px;
    }
    .brand h1{
        margin:0;
        font-size:23px;
        font-weight:700;
    }
    .brand p{
        margin:5px 0 0;
        color:var(--muted);
        font-size:13px;
    }
    .new-btn{
        width:100%;
        border:0;
        border-radius:11px;
        padding:12px 15px;
        background:var(--text);
        color:white;
        font-weight:600;
        margin-bottom:20px;
    }
    .new-btn:hover{opacity:.9}

    .list-title{
        padding:0 10px 8px;
        color:var(--muted);
        font-size:12px;
        text-transform:uppercase;
        letter-spacing:.08em;
        font-weight:700;
    }
    .list{
        overflow:auto;
        padding-right:3px;
    }
    .item{
        display:flex;
        align-items:center;
        gap:10px;
        padding:11px 10px;
        border-radius:10px;
        margin-bottom:3px;
        transition:.15s;
    }
    .item:hover{background:#f0ede8}
    .item.active{
        background:var(--accent-light);
    }
    .item-main{
        min-width:0;
        flex:1;
    }
    .item-name{
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
        font-weight:600;
        font-size:14px;
    }
    .item-meta{
        color:var(--muted);
        font-size:12px;
        margin-top:2px;
    }
    .delete{
        border:0;
        background:transparent;
        color:#aaa;
        font-size:18px;
        padding:2px 5px;
        border-radius:6px;
    }
    .delete:hover{background:#eee1df;color:var(--danger)}

    /* GŁÓWNY PANEL */
    .main{
        flex:1;
        padding:35px clamp(20px,4vw,60px);
        overflow:auto;
    }
    .workspace{
        max-width:1000px;
        margin:0 auto;
    }
    .topbar{
        display:flex;
        align-items:flex-end;
        gap:20px;
        margin-bottom:28px;
    }
    .title-wrap{flex:1}
    .label{
        display:block;
        color:var(--muted);
        font-size:12px;
        font-weight:700;
        text-transform:uppercase;
        letter-spacing:.08em;
        margin-bottom:7px;
    }
    #title{
        width:100%;
        border:0;
        border-bottom:2px solid var(--line);
        background:transparent;
        outline:0;
        padding:4px 2px 9px;
        font-size:29px;
        font-weight:700;
        color:var(--text);
    }
    #title:focus{border-color:var(--accent)}

    .stats{
        background:var(--panel);
        border:1px solid var(--line);
        border-radius:12px;
        padding:11px 17px;
        min-width:145px;
        text-align:center;
        box-shadow:var(--shadow);
    }
    .stats strong{font-size:20px}
    .stats span{display:block;color:var(--muted);font-size:12px}

    .card{
        background:var(--panel);
        border:1px solid var(--line);
        border-radius:18px;
        box-shadow:var(--shadow);
        padding:24px;
    }

    .toolbar{
        display:flex;
        align-items:center;
        gap:14px;
        flex-wrap:wrap;
        padding-bottom:20px;
        border-bottom:1px solid #eeeae5;
        margin-bottom:24px;
    }
    .tool-label{
        color:var(--muted);
        font-size:13px;
        font-weight:600;
    }
    .color-input{
        width:45px;
        height:36px;
        padding:3px;
        border:1px solid var(--line);
        border-radius:8px;
        background:white;
        cursor:pointer;
    }
    .color-name{
        min-width:92px;
        font-size:13px;
        color:var(--muted);
    }
    .tool-btn{
        border:1px solid var(--line);
        background:white;
        border-radius:8px;
        padding:8px 12px;
        color:var(--text);
    }
    .tool-btn:hover{background:#f6f3ef}
    .tool-btn.eraser.active{
        background:#eeeae5;
        border-color:#c9c3bb;
        font-weight:600;
    }
    .tool-spacer{flex:1}

    .grid-wrap{
        display:flex;
        justify-content:center;
        overflow:auto;
        padding:3px;
    }
    .grid{
        display:grid;
        grid-template-columns:repeat(10, minmax(48px, 1fr));
        width:min(700px,100%);
        aspect-ratio:1;
        border:2px solid #77716b;
        background:#77716b;
        gap:1px;
    }
    .cell{
        position:relative;
        border:0;
        background:#fff;
        color:#6e6963;
        font-size:15px;
        font-weight:600;
        display:flex;
        align-items:center;
        justify-content:center;
        transition:filter .1s, transform .1s;
        user-select:none;
    }
    .cell:hover{
        filter:brightness(.95);
        outline:2px solid var(--accent);
        outline-offset:-2px;
        z-index:2;
    }
    .cell.painted{
        color:#252321;
    }
    .cell::after{
        content:"";
        position:absolute;
        inset:0;
        background:rgba(255,255,255,.16);
        pointer-events:none;
        opacity:0;
    }
    .cell.painted::after{opacity:1}

    .hint{
        text-align:center;
        color:var(--muted);
        font-size:12px;
        margin-top:18px;
    }

    .empty{
        color:var(--muted);
        text-align:center;
        padding:25px 10px;
        font-size:14px;
    }

    @media(max-width:720px){
        .app{display:block}
        .sidebar{
            width:100%;
            border-right:0;
            border-bottom:1px solid var(--line);
            padding:15px;
        }
        .brand{padding-bottom:13px}
        .list{display:flex;gap:5px;overflow-x:auto}
        .item{min-width:190px;background:#f4f1ed}
        .new-btn{margin-bottom:12px}
        .main{padding:20px 12px}
        .topbar{align-items:stretch;flex-direction:column}
        #title{font-size:24px}
        .stats{min-width:0}
        .card{padding:15px}
        .grid{grid-template-columns:repeat(10,minmax(32px,1fr))}
        .cell{font-size:12px}
    }
</style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand">
            <h1>Moje kolorowanki</h1>
            <p>Twoje plansze 1–100 zapisane lokalnie</p>
        </div>

        <button class="new-btn" id="newBtn">＋ Nowa kolorowanka</button>

        <div class="list-title">Kolorowanki</div>
        <div class="list" id="list"></div>
    </aside>

    <main class="main">
        <div class="workspace">
            <div class="topbar">
                <div class="title-wrap">
                    <span class="label">Tytuł kolorowanki</span>
                    <input id="title" value="" placeholder="Wpisz tytuł…">
                </div>
                <div class="stats">
                    <strong id="progress">0 / 100</strong>
                    <span>pokolorowanych</span>
                </div>
            </div>

            <section class="card">
                <div class="toolbar">
                    <span class="tool-label">Kolor:</span>
                    <input class="color-input" id="color" type="color" value="#e57373">
                    <span class="color-name" id="colorName">#E57373</span>

                    <button class="tool-btn eraser" id="eraser">⌫ Gumka</button>
                    <span class="tool-spacer"></span>
                    <button class="tool-btn" id="clearAll">Wyczyść planszę</button>
                </div>

                <div class="grid-wrap">
                    <div class="grid" id="grid"></div>
                </div>

                <div class="hint">
                    Kliknij kwadracik, aby go pokolorować. Kliknij ponownie, aby go wyczyścić.
                    Wybrany kolor jest zapisywany osobno dla każdej kratki.
                </div>
            </section>
        </div>
    </main>
</div>

<script>
const STORAGE_KEY = "moje-kolorowanki-v1";

let data = load();
let activeId = data.activeId;

function load(){
    try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if(saved && Array.isArray(saved.items) && saved.items.length){
            return saved;
        }
    } catch(e){}
    const first = createItem("Moja kolorowanka 1");
    return {items:[first], activeId:first.id};
}

function createItem(title){
    return {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()),
        title,
        cells: Array.from({length:100}, () => ({painted:false, color:null}))
    };
}

function save(){
    data.activeId = activeId;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    renderSidebar();
}

function active(){
    return data.items.find(x => x.id === activeId);
}

function renderSidebar(){
    const list = document.getElementById("list");
    list.innerHTML = "";

    if(!data.items.length){
        list.innerHTML = '<div class="empty">Brak kolorowanek.</div>';
        return;
    }

    data.items.forEach(item => {
        const painted = item.cells.filter(c => c.painted).length;
        const row = document.createElement("div");
        row.className = "item" + (item.id === activeId ? " active" : "");
        row.innerHTML = `
            <div class="item-main">
                <div class="item-name">${escapeHtml(item.title || "Bez tytułu")}</div>
                <div class="item-meta">${painted} / 100 pokolorowanych</div>
            </div>
            <button class="delete" title="Usuń kolorowankę">×</button>
        `;

        row.querySelector(".item-main").onclick = () => {
            activeId = item.id;
            render();
        };

        row.querySelector(".delete").onclick = (e) => {
            e.stopPropagation();
            deleteItem(item.id);
        };

        list.appendChild(row);
    });
}

function renderGrid(){
    const item = active();
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    item.cells.forEach((cell, i) => {
        const btn = document.createElement("button");
        btn.className = "cell" + (cell.painted ? " painted" : "");
        btn.textContent = i + 1;

        if(cell.painted && cell.color){
            btn.style.background = cell.color;
        }

        btn.title = cell.painted
            ? `Nr ${i+1} — ${cell.color}`
            : `Nr ${i+1} — niepokolorowane`;

        btn.onclick = () => toggleCell(i);
        grid.appendChild(btn);
    });

    const count = item.cells.filter(c => c.painted).length;
    document.getElementById("progress").textContent = `${count} / 100`;
}

function render(){
    const item = active();
    if(!item) return;

    document.getElementById("title").value = item.title;
    renderSidebar();
    renderGrid();
}

function toggleCell(index){
    const item = active();
    const eraser = document.getElementById("eraser").classList.contains("active");
    const cell = item.cells[index];

    if(eraser){
        cell.painted = false;
        cell.color = null;
    } else if(cell.painted){
        cell.painted = false;
        cell.color = null;
    } else {
        cell.painted = true;
        cell.color = document.getElementById("color").value;
    }

    save();
    renderGrid();
}

document.getElementById("newBtn").onclick = () => {
    const number = data.items.length + 1;
    const item = createItem(`Moja kolorowanka ${number}`);
    data.items.push(item);
    activeId = item.id;
    save();
    render();
    document.getElementById("title").focus();
    document.getElementById("title").select();
};

document.getElementById("title").addEventListener("input", e => {
    const item = active();
    if(!item) return;
    item.title = e.target.value;
    localStorage.setItem(STORAGE_KEY, JSON.stringify({...data, activeId}));
    renderSidebar();
});

document.getElementById("color").addEventListener("input", e => {
    document.getElementById("colorName").textContent = e.target.value.toUpperCase();
});

document.getElementById("eraser").onclick = () => {
    document.getElementById("eraser").classList.toggle("active");
};

document.getElementById("clearAll").onclick = () => {
    const item = active();
    if(!item) return;
    if(!confirm("Wyczyścić wszystkie 100 kratek w tej kolorowance?")) return;
    item.cells.forEach(c => {c.painted=false; c.color=null});
    save();
    renderGrid();
};

function deleteItem(id){
    if(data.items.length === 1){
        alert("Musi zostać przynajmniej jedna kolorowanka.");
        return;
    }

    const item = data.items.find(x => x.id === id);
    if(!confirm(`Usunąć kolorowankę „${item.title || "Bez tytułu"}”?`)) return;

    data.items = data.items.filter(x => x.id !== id);
    if(activeId === id) activeId = data.items[0].id;
    save();
    render();
}

function escapeHtml(text){
    return text.replace(/[&<>"']/g, char => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[char]));
}

render();
</script>
</body>
</html>
